function normNombre(s) {
  return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
}

async function run() {
  document.getElementById('btn').disabled = true;
  const emailVal = document.getElementById('email-inp').value.trim();
  const passVal  = document.getElementById('pass-inp').value;
  if (!passVal) { L('⚠ Ingresa la contraseña', 'err'); document.getElementById('btn').disabled=false; return; }

  L('🔐 Iniciando sesión...', 'inf');
  try { await auth.signInWithEmailAndPassword(emailVal, passVal); }
  catch(e) { L('❌ Login fallido: ' + e.message, 'err'); document.getElementById('btn').disabled=false; return; }

  const opId = auth.currentUser.uid;
  L('✅ Sesión iniciada. opId = ' + opId, 'ok');

  // Cargar clientes
  L('\n📂 Cargando clientes...', 'inf');
  const clientesSnap = await db.collection('patriarca_clientes').where('opId','==',opId).get();
  const clientes = clientesSnap.docs.map(d => ({id: d.id, ...d.data()}));
  L('   → ' + clientes.length + ' clientes encontrados', 'inf');

  function findCliente(nombre) {
    const norm = normNombre(nombre);
    return clientes.find(c => normNombre(c.nombre || c.nombre_cliente || '') === norm)
        || clientes.find(c => normNombre(c.nombre || c.nombre_cliente || '').includes(norm.split(' ')[0]));
  }

  // Cargar eventos
  L('📂 Cargando eventos...', 'inf');
  const eventosSnap = await db.collection('patriarca_eventos').where('opId','==',opId).get();
  const eventos = eventosSnap.docs.map(d => ({id: d.id, ...d.data()}));
  L('   → ' + eventos.length + ' eventos encontrados', 'inf');

  function findEvento(num) { return eventos.find(e => parseInt(e.num) === num); }

  // Borrar movimientos existentes
  L('\n🗑 Borrando movimientos existentes...', 'inf');
  const movSnap = await db.collection('patriarca_movimientos').where('opId','==',opId).get();
  L('   → ' + movSnap.size + ' movimientos encontrados', 'inf');
  const CHUNK = 400;
  for (let i=0; i<movSnap.docs.length; i+=CHUNK) {
    const fb = db.batch();
    movSnap.docs.slice(i,i+CHUNK).forEach(d => fb.delete(d.ref));
    await fb.commit();
  }
  L('   ✅ ' + movSnap.size + ' borrados', 'ok');

  // Crear movimientos
  L('\n📥 Creando 62 movimientos...', 'inf');
  let ok = 0, warn = 0;
  const docs = [];

  for (const [op_raw, id_ev, fecha, clienteNombre, monto, casa, tipo, metodoRaw, comision, impacto] of MOVS_RAW) {
    // Parsear canal desde "N - C - OP" o "N - I - OP"
    const parts = op_raw.split('-').map(s => s.trim());
    const num   = parseInt(parts[0]);
    const opPart = parts[1] || 'C';
    const metodo = normMetodo(metodoRaw);
    const esInterno = METODOS_INTERNOS.has(metodo);
    const canal = esInterno ? 'I-OP' : 'C-OP';
    const op_id = num + ' - ' + (esInterno ? 'I' : 'C') + ' - OP';

    // Buscar cliente
    const cli = findCliente(clienteNombre);
    const cliente_id = cli ? cli.id : null;
    const cliente_nombre_final = cli ? (cli.nombre || cli.nombre_cliente || clienteNombre) : clienteNombre;
    if (!cli) { L('   ⚠ Cliente no encontrado: ' + clienteNombre, 'inf'); warn++; }

    // Buscar evento
    const ev = findEvento(id_ev);
    const id_evento_ref = ev ? ev.id : null;
    const id_apuesta = ev ? String(ev.num) : String(id_ev);
    if (!ev) { L('   ⚠ Evento no encontrado: #' + id_ev, 'inf'); warn++; }

    docs.push({
      opId,
      op_id,
      canal,
      num,
      fecha,
      cliente: cliente_nombre_final,
      cliente_id: cliente_id || '',
      monto,
      casa,
      tipo,
      metodo,
      comision,
      impacto,
      id_apuesta,
      id_evento_ref: id_evento_ref || '',
      estado_cajero: 'Realizada',
      descuentos: '',
      monto_descuento: 0,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    });
    ok++;
  }

  // Escribir en Firestore por chunks
  for (let i=0; i<docs.length; i+=CHUNK) {
    const fb = db.batch();
    docs.slice(i,i+CHUNK).forEach(d => fb.set(db.collection('patriarca_movimientos').doc(), d));
    await fb.commit();
  }

  await auth.signOut();

  L('\n' + '─'.repeat(50), 'inf');
  L('✅ ' + ok + ' movimientos cargados correctamente.', 'ok');
  if (warn) L('⚠ ' + warn + ' advertencias (clientes/eventos no encontrados — revisa arriba).', 'inf');
  L('\n🔄 Recarga el portal de Vanlly (Cmd+Shift+R) para ver los cambios.', 'inf');
  L('🗑 Puedes cerrar y borrar este archivo.', 'inf');
}
