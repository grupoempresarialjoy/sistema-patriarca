const log = document.getElementById('log');
function L(msg, cls='') { log.innerHTML += `<span class="${cls}">${msg}</span>\n`; }

async function run() {
  const emailVal = document.getElementById('email-inp').value.trim();
  const passVal  = document.getElementById('pass-inp').value;
  if (!passVal) { L('⚠ Ingresa la contraseña', 'err'); return; }
  document.getElementById('btn').disabled = true;

  L('🔐 Iniciando sesión como ' + emailVal + '...', 'inf');
  try {
    await auth.signInWithEmailAndPassword(emailVal, passVal);
  } catch(e) {
    L('❌ Login fallido: ' + e.message, 'err');
    document.getElementById('btn').disabled = false;
    return;
  }

  const opId = auth.currentUser.uid;
  L('✅ Sesión iniciada. opId = ' + opId, 'ok');

  // 1. Borrar todos los eventos existentes de este opId
  L('🗑  Borrando eventos existentes...', 'inf');
  const snap = await db.collection('patriarca_eventos').where('opId','==',opId).get();
  L(`   → ${snap.size} eventos encontrados para borrar`, 'inf');

  const CHUNK = 400;
  const refs = snap.docs.map(d => d.ref);
  for (let i = 0; i < refs.length; i += CHUNK) {
    const fb = db.batch();
    refs.slice(i, i + CHUNK).forEach(r => fb.delete(r));
    await fb.commit();
  }
  L(`   ✅ ${refs.length} eventos borrados`, 'ok');

  // 2. Crear los 26 eventos frescos
  L('📥 Creando 26 eventos desde Excel...', 'inf');
  for (let i = 0; i < EVENTOS.length; i += CHUNK) {
    const fb = db.batch();
    EVENTOS.slice(i, i + CHUNK).forEach(ev => {
      fb.set(db.collection('patriarca_eventos').doc(), {
        opId,
        num:             ev.num,
        nombre:          ev.nombre,
        fecha_registro:  ev.fecha_registro,
        fecha_evento:    ev.fecha_evento,
        deporte:         ev.deporte,
        opciones:        ev.opciones,
        estado:          ev.estado,
        opcion_ganadora: ev.opcion_ganadora,
        analisis:        ev.analisis,
        ts: firebase.firestore.FieldValue.serverTimestamp(),
      });
    });
    await fb.commit();
  }

  await auth.signOut();
  L('', '');
  L('✅ ¡Listo! 26 eventos cargados correctamente en el portal de Vanlly.', 'ok');
  L('Recarga el portal de Vanlly para ver los cambios (Cmd+Shift+R).', 'inf');
  L('Puedes cerrar esta página y borrar seed-eventos-vanlly.html.', 'inf');
}
