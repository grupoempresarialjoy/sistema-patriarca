function log(msg, cls='ok') {
  document.getElementById('log').innerHTML += `<span class="${cls}">${msg}</span>\n`;
}

async function seedCupo() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  log('🔑 Iniciando sesión como admin...', 'inf');

  try {
    await auth.signInWithEmailAndPassword('vanlly.admin@admin.aj16.com', 'Admin_2026');
    log('✅ Login OK');
  } catch(e) {
    log('❌ Login fallido: ' + e.message, 'err');
    btn.disabled = false; return;
  }

  // Cargar operadores de admin_usuarios
  log('🔍 Leyendo operadores de Unity...', 'inf');
  const opsSnap = await db.collection('admin_usuarios')
    .where('rol','==','operador')
    .get();

  const ops = opsSnap.docs.map(d => ({
    docId: d.id,
    uid:   d.data().uid || d.id,
    nombre: d.data().nombre || '',
  }));
  log(`ℹ ${ops.length} operadores encontrados`, 'inf');

  // Cargar nombres de métodos desde Firestore para normalizar
  const metSnap = await db.collection('admin_config').doc('metodos').get();
  const metodos = (metSnap.exists ? (metSnap.data().lista || []) : []).map(m => m.nombre);
  log(`ℹ ${metodos.length} métodos cargados: ${metodos.join(', ')}`, 'inf');

  // Para cada operador con datos, escribir su cupo
  for (const op of ops) {
    const dataNombre = Object.keys(CUPO).find(n =>
      n.toLowerCase() === op.nombre.toLowerCase() ||
      op.nombre.toLowerCase().includes(n.split(' ')[0].toLowerCase())
    );

    if (!dataNombre) {
      log(`⚠ Sin datos para: ${op.nombre}`, 'ski');
      continue;
    }

    const rawCupo = CUPO[dataNombre];
    // Normalizar claves al formato exacto de Firestore
    const cupos_cajero = {};
    for (const [clave, valor] of Object.entries(rawCupo)) {
      // Buscar el método en la lista de Firestore (case-insensitive)
      const metodoDB = metodos.find(m => m.toUpperCase() === clave.toUpperCase()) || clave;
      cupos_cajero[metodoDB] = valor;
    }

    try {
      await db.collection('patriarca_config').doc(op.uid).set(
        { cupos_cajero },
        { merge: true }
      );
      const resumen = Object.entries(cupos_cajero)
        .map(([m,v]) => `${m}: ${v.toLocaleString('es-CO')}`)
        .join(' | ');
      log(`✅ ${op.nombre}: ${resumen}`);
    } catch(e) {
      log(`❌ Error en ${op.nombre}: ${e.message}`, 'err');
    }
  }

  await auth.signOut();
  log('\n🎉 Listo. Recarga el cajero para ver los cupos.', 'inf');
  btn.disabled = false;
}
