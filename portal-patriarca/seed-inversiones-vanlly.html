  function findCliente(nombre) {
    const n = normNombre(nombre);
    return clientes.find(c=>normNombre(c.nombre||c.nombre_cliente||'')===n)
        || clientes.find(c=>normNombre(c.nombre||c.nombre_cliente||'').includes(n.split(' ')[0]));
  }

  // Cargar eventos
  L('📂 Cargando eventos...','inf');
  const evSnap = await db.collection('patriarca_eventos').where('opId','==',opId).get();
  const eventos = evSnap.docs.map(d=>({id:d.id,...d.data()}));
  L('   → '+eventos.length+' eventos','inf');
  function findEvento(num) { return eventos.find(e=>parseInt(e.num)===num); }

  // Borrar inversiones existentes
  L('\n🗑 Borrando inversiones existentes...','inf');
  const invSnap = await db.collection('patriarca_inversiones').where('opId','==',opId).get();
  L('   → '+invSnap.size+' encontradas','inf');
  const CHUNK = 400;
  for (let i=0;i<invSnap.docs.length;i+=CHUNK) {
    const fb=db.batch(); invSnap.docs.slice(i,i+CHUNK).forEach(d=>fb.delete(d.ref)); await fb.commit();
  }
  L('   ✅ '+invSnap.size+' borradas','ok');

  // Crear inversiones
  L('\n📥 Creando 94 inversiones...','inf');
  let ok=0, warn=0;
  const docs=[];

  for (const row of INV) {
    const [fecha,id_ap,id_ev_num,clienteNom,monto,casa,opcion,cuota,eventoNom,fondos,id_recarga,comision,control,potencial,estado,ret_cli,ret_plat,impacto] = row;

    const ev  = findEvento(id_ev_num);
    const cli = findCliente(clienteNom);
    if (!ev)  { L('   ⚠ Evento no encontrado: #'+id_ev_num,'inf'); warn++; }
    if (!cli) { L('   ⚠ Cliente no encontrado: '+clienteNom,'inf'); warn++; }

    docs.push({
      opId,
      fecha,
      id_apuesta:          id_ap,
      id_evento_ref:       ev?.id || null,
      evento:              ev?.nombre || eventoNom,
      cliente:             cli?.nombre || cli?.nombre_cliente || clienteNom,
      cliente_id:          cli?.id || '',
      monto,
      casa,
      opcion_elegida:      String(opcion),
      cuota,
      fondos,
      id_recarga:          id_recarga || '',
      id_recarga_label:    id_recarga || '',
      comision_aplicada:   comision || 0,
      control_recarga:     control || '',
      potencial_retorno:   potencial || Math.round(monto * cuota),
      estado_evento:       estado || 'CERRADO',
      retorno_cliente:     ret_cli || 0,
      retorno_plataforma:  ret_plat || 0,
      impacto_apuesta:     impacto || 0,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
    });
    ok++;
  }

  for (let i=0;i<docs.length;i+=CHUNK) {
    const fb=db.batch();
    docs.slice(i,i+CHUNK).forEach(d=>fb.set(db.collection('patriarca_inversiones').doc(),d));
    await fb.commit();
  }

  await auth.signOut();
  L('\n'+'─'.repeat(50),'inf');
  L('✅ '+ok+' inversiones cargadas.','ok');
  if (warn) L('⚠ '+warn+' advertencias (clientes/eventos no encontrados).','inf');
  L('\n🔄 Recarga el portal de Vanlly (Cmd+Shift+R).','inf');
  L('🗑 Puedes cerrar y borrar este archivo.','inf');
}
</script>
